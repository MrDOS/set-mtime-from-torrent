[project]
name = "set-mtime-from-torrent"
version = "0.0.0"
dependencies = [
    "bencode.py",
    "platformdirs",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
]

[project.scripts]
set-mtime-from-torrent = "torrenttime:main"

[tool.isort]
profile = "black"
force_sort_within_sections = true
